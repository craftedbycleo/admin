<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · London Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ Tokens: swap these for your brand ============ */
:root{
  --o:#F26A3D; --o-deep:#E04E1F; --o-soft:#FDE6DC;
  --accent:#9CCE1E; --globe:#06434C;
  --ink:#16130F; --ink-2:#5E5852; --ink-3:#9A938C;
  --line:#ECE8E4; --bg:#F9F9F9;
  --sans:"Inter Tight",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ Contact section ============ */
.contact{max-width:1280px;margin:0 auto;padding:48px 24px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:8px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--o-deep)}
.head h2{font-weight:500;font-size:clamp(40px,6vw,76px);line-height:.98;letter-spacing:-.035em;margin-top:16px}
.head p{color:var(--ink-2);font-size:18px;max-width:34ch}

.stage-wrap{display:grid;grid-template-columns:minmax(0,856fr) minmax(260px,306fr);align-items:center;gap:0}
.map{position:relative;height:clamp(380px,39vw,458px);overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,#ece7e2 1px,transparent 0);background-size:22px 22px}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 45% 70%,transparent 40%,var(--bg) 78%)}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:2}

.pin{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;opacity:0}
.pin .core{position:absolute;inset:0;border-radius:50%;background:var(--accent);box-shadow:0 4px 14px -2px rgba(6,67,76,.35);transform:scale(.2);transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.pin.show{opacity:1}.pin.show .core{transform:scale(1)}
.pin::before,.pin::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent);opacity:0}
.pin.show::before{animation:ring 2.8s .6s cubic-bezier(.2,.6,.3,1) infinite}
.pin.show::after{animation:ring 2.8s 2s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}

.callout{position:absolute;left:0;top:0;width:300px;padding:18px 20px;background:rgba(255,255,255,.94);backdrop-filter:blur(4px);border:1px dashed var(--accent);opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.callout.show{opacity:1;transform:none}
.callout i{position:absolute;width:12px;height:12px;border:0 solid var(--accent)}
.callout i:nth-child(1){left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}
.callout i:nth-child(2){right:-1px;top:-1px;border-right-width:2px;border-top-width:2px}
.callout i:nth-child(3){left:-1px;bottom:-1px;border-left-width:2px;border-bottom-width:2px}
.callout i:nth-child(4){right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}
.callout b{display:block;font-weight:500;font-size:22px;letter-spacing:-.015em;margin-bottom:4px}
.callout span{display:block;color:var(--ink-2);font-size:15px;line-height:1.45}
.callout small{display:block;margin-top:12px;font:500 11px var(--mono);color:var(--o-deep);letter-spacing:.05em}
.callout .reach{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font:500 11px var(--mono);color:var(--ink-3);letter-spacing:.05em;opacity:0;transition:opacity .6s}
.callout .reach.show{opacity:1}
.tag{position:absolute;left:0;top:0;font:500 11px/1 var(--mono);color:var(--o-deep);letter-spacing:.06em;white-space:nowrap;opacity:0;transition:opacity .5s}
.tag.show{opacity:1}

/* ============ Info row (like the reference address grid) ============ */
.row{display:grid;grid-template-columns:1.1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.cell+.cell{border-left:1px solid var(--line)}
.label{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.status{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px}
.live{width:8px;height:8px;background:var(--o);position:relative;flex:none}
.live.on::after{content:"";position:absolute;inset:-4px;border:1px solid var(--o);animation:sq 2s infinite}
@keyframes sq{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.live.off{background:var(--ink-3)}
.clock{display:flex;align-items:baseline;font:500 64px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.clock .colon{animation:blink 2s steps(1) infinite;margin:0 1px}
@keyframes blink{50%{opacity:.25}}
.clock small{font:500 13px var(--mono);letter-spacing:.04em;color:var(--o-deep);margin-left:12px;align-self:flex-start;margin-top:8px}
.rel{color:var(--ink-2);font-size:15px}
.daybar{position:relative;height:38px;margin-top:4px}
.daybar .track{position:absolute;left:0;right:0;top:8px;height:8px;background:repeating-linear-gradient(90deg,#ece8e4 0 3px,transparent 3px 6px)}
.daybar .work{position:absolute;top:8px;height:8px;background:var(--o)}
.daybar .you{position:absolute;top:19px;height:3px;background:var(--ink)}
.daybar .now{position:absolute;top:1px;width:2px;height:24px;background:var(--ink);transform:translateX(-1px)}
.daybar .now::after{content:"NOW";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font:500 9px var(--mono);letter-spacing:.06em}
.daybar .ticks{position:absolute;left:0;right:0;top:27px;display:flex;justify-content:space-between;font:400 10px var(--mono);color:var(--ink-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:6px;background:var(--o)}
.legend i.y{height:3px;background:var(--ink)}
.hours{font-size:15px;color:var(--ink-2)}
.hours b{color:var(--ink);font-weight:500}
.addr{font-size:17px;line-height:1.45}
.addr .city{font-weight:500;font-size:22px;letter-spacing:-.015em;display:block;margin-bottom:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:500 14px/1 var(--sans);padding:12px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,color .2s,background .2s;text-decoration:none}
.btn:hover{border-color:var(--o);color:var(--o-deep)}
.btn:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.btn.primary{background:var(--o);border-color:var(--o);color:#fff}
.btn.primary:hover{background:var(--o-deep);color:#fff}
.btn svg{width:15px;height:15px}
.pin{width:14px!important;height:14px!important;margin:-7px 0 0 -7px!important}
.pin .core{box-shadow:none!important}
.pin::before,.pin::after{border-width:1.5px!important}

/* City labels (from the Figma design) */
.city-tag{position:absolute;left:0;top:0;height:32px;padding:0 12px;display:flex;align-items:center;background:#fff;border-radius:6px;
  font:400 15px/1 "Inter",var(--sans);color:rgba(0,0,0,.55);letter-spacing:-.01em;white-space:nowrap;opacity:0;transition:opacity .5s}
.city-tag.show{opacity:1}

/* Address card (from the Figma design) */
.side{justify-self:start;margin-left:18px;width:266px;display:flex;flex-direction:column;gap:8px}
.place{width:100%;background:#fff;border:1px dashed rgba(0,0,0,.18);border-radius:10px;padding:20px;
  font-family:"Inter",var(--sans);color:#000}

.place h3{font-weight:500;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.place address{font-style:normal;font-size:16.5px;line-height:21px;color:rgba(0,0,0,.55);margin-top:8px}
.place a{display:inline-flex;align-items:center;gap:10px;margin-top:20px;font-size:17px;font-weight:500;color:var(--globe);text-decoration:none;
  padding-bottom:6px;border-bottom:.8px solid var(--globe);letter-spacing:-.01em}
.place a svg{width:16px;height:16px;transition:transform .2s}
.place a:hover svg{transform:translateX(3px)}
.team{align-self:flex-start;display:flex;align-items:center;padding:10px;background:#fff;border-radius:33px}
.team img,.team .logo{width:45px;height:45px;border-radius:50%;border:1px solid var(--accent);object-fit:cover;display:block;background:#fff}
.team>*+*{margin-left:-15px}
.place a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:860px){
  .stage-wrap{grid-template-columns:1fr}
  .side{justify-self:stretch;margin:16px 0 0;width:auto}
}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;font:500 14px var(--sans);opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:960px){
  .row{grid-template-columns:1fr 1fr}
  .cell:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:640px){
  .contact{padding:56px 16px 64px}
  .map{height:380px}
  .row{grid-template-columns:1fr}
  .cell{padding:24px 4px}
  .cell+.cell{border-left:0;border-top:1px solid var(--line)}
  .callout{display:none}
  .clock{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

95,993,795,-933,803,-844,803,-800,803,-756,803,-711,803,-667,803,-622,803,-578,803,-533,803,-489,803,-444,803,-400,803,-356,803,-311,803,-267,803,-222,803,-178,803,489,803,533,803,578,803,933,803,-864,810,-816,810,-768,810,-720,810,-672,810,-624,810,-576,810,-528,810,-480,810,-432,810,-384,810,-336,810,-288,810,-240,810,-192,810,-144,810,576,810,960,810,-887,818,-835,818,-783,818,-730,818,-678,818,-574,818,-522,818,-470,818,-417,818,-365,818,-313,818,-261,818,-157,818,-800,825,-743,825,-686,825,-457,825,-400,825,-343,825,-286,825,-229,825,-354,833,-289,833];
const D2R=Math.PI/180, TAU=Math.PI*2, O='#F26A3D', O_DEEP='#E04E1F';
const GLOBE='#06434C', LINE='#9CCE1E', LINE_RGB='156,206,30';   // globe dots, location lines
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eout=t=>1-Math.pow(1-t,3), eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---- data ---- */
const W=(()=>{const n=WORLD_RAW.length/2,lon=new Float32Array(n),cl=new Float32Array(n),sl=new Float32Array(n),band=new Float32Array(n);
  for(let i=0;i<n;i++){const L=WORLD_RAW[2*i]/10,P=WORLD_RAW[2*i+1]/10;lon[i]=L*D2R;cl[i]=Math.cos(P*D2R);sl[i]=Math.sin(P*D2R);band[i]=Math.exp(-L*L/5)}
  return {n,lon,cl,sl,band}})();
const MERIDIAN=[];for(let la=89;la>=-89;la-=.5)MERIDIAN.push([0,la]);
const vec=(lo,la)=>{lo*=D2R;la*=D2R;return[Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)]};
const ARCS=CLIENTS.map(([name,lo,la,side])=>{
  const A=vec(...STUDIO.coords),B=vec(lo,la),w=Math.acos(Math.min(1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])),N=80,pts=[];
  for(let i=0;i<=N;i++){const u=i/N,sa=Math.sin((1-u)*w)/Math.sin(w),sb=Math.sin(u*w)/Math.sin(w);
    const x=sa*A[0]+sb*B[0],y=sa*A[1]+sb*B[1],z=sa*A[2]+sb*B[2];
    pts.push([Math.atan2(y,x)/D2R,Math.asin(z)/D2R,Math.min(.3,w*.26)*Math.sin(Math.PI*u)])}
  return {name,lo,la,side,pts}});
document.getElementById('clientList').textContent='Client cities: '+CLIENTS.map(c=>c[0]).join(', ')+'.';

/* ---- projection ---- */
function View(lon,lat,R,cx,cy){const p=lat*D2R;return{l0:lon*D2R,s0:Math.sin(p),c0:Math.cos(p),R,cx,cy}}
function project(v,lon,lat,alt=0){
  const L=lon*D2R-v.l0,P=lat*D2R,cl=Math.cos(P),sl=Math.sin(P),cd=Math.cos(L);
  const z=v.s0*sl+v.c0*cl*cd,x=cl*Math.sin(L),y=v.c0*sl-v.s0*cl*cd,m=1+alt;
  return {x:v.cx+v.R*x*m,y:v.cy-v.R*y*m,z,vis:z>0||(x*x+y*y)*m*m>1};
}

/* ---- stage ---- */
const el=document.getElementById('map'),cv=el.querySelector('canvas'),ctx=cv.getContext('2d'),ov=el.querySelector('.overlay');
let SW=1,SH=1,dirty=true;
function resize(){const r=el.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);SW=r.width;SH=r.height;cv.width=SW*d;cv.height=SH*d;ctx.setTransform(d,0,0,d,0,0);dirty=true}
new ResizeObserver(resize).observe(el);resize();
const narrow=()=>SW<640;

const pin=document.createElement('div');pin.className='pin';
pin.innerHTML='<div class="core"></div>';
ov.appendChild(pin);
ARCS.forEach(a=>{a.el=document.createElement('div');a.el.className='city-tag';a.el.textContent=a.name;ov.appendChild(a.el)});



/* ---- drawing ---- */
function sphere(v){const g=ctx.createRadialGradient(v.cx-v.R*.3,v.cy-v.R*.35,v.R*.1,v.cx,v.cy,v.R);
  g.addColorStop(0,'#F9F9F9');g.addColorStop(.65,'#F9F9F9');g.addColorStop(1,'#EAF1F2');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(v.cx,v.cy,v.R,0,TAU);ctx.fill();ctx.strokeStyle='rgba(6,67,76,.10)';ctx.lineWidth=1;ctx.stroke()}
function graticule(v){ctx.save();ctx.strokeStyle='rgba(6,67,76,.06)';ctx.lineWidth=1;ctx.beginPath();
  const run=(f,a,b,s)=>{let pen=false;for(let t=a;t<=b;t+=s){const p=f(t);if(p.z>0){pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);pen=true}else pen=false}};
  for(let L=-165;L<180;L+=15){if(L===0)continue;run(t=>project(v,L,t),-80,80,2)}
  for(let P=-75;P<=75;P+=15)run(t=>project(v,t,P),-180,180,2);ctx.stroke();ctx.restore()}
function dots(v,reveal){ctx.fillStyle=GLOBE;
  for(let i=0;i<W.n;i++){const dl=W.lon[i]-v.l0,cl=W.cl[i],sl=W.sl[i],cd=Math.cos(dl),z=v.s0*sl+v.c0*cl*cd;if(z<=0)continue;
    const x=v.cx+v.R*cl*Math.sin(dl),y=v.cy-v.R*(v.c0*sl-v.s0*cl*cd);if(y>SH+4||x<-4||x>SW+4)continue;
    const k=0,sz=1.8*(.45+.55*z)*(1+.35*k);ctx.globalAlpha=(.35+.65*z)*(.38+.62*k);ctx.fillRect(x-sz/2,y-sz/2,sz,sz)}
  ctx.globalAlpha=1}
function line(v,pts,{progress=1,width=2,color=O,glow=0}={}){
  if(pts.length<2)return;const n=Math.min(pts.length,Math.max(2,Math.floor(pts.length*progress)));
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow}
  ctx.beginPath();let pen=false;for(let i=0;i<n;i++){const q=pts[i],p=project(v,q[0],q[1],q[2]||0);if(p.vis){pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);pen=true}else pen=false}
  ctx.stroke();ctx.restore()}


/* ---- prime meridian: solid teal, fading in at its top end ---- */
function meridian(v,progress){
  const vis=MERIDIAN.map(q=>project(v,q[0],q[1])).filter(p=>p.z>0);if(vis.length<2)return;
  const n=Math.max(2,Math.floor(vis.length*progress)),a=vis[0],b=vis[vis.length-1];
  const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);g.addColorStop(0,'rgba(6,67,76,0)');g.addColorStop(.034,GLOBE);g.addColorStop(1,GLOBE);
  ctx.save();ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);
  for(let i=1;i<n;i++)ctx.lineTo(vis[i].x,vis[i].y);ctx.stroke();ctx.restore();
}

/* ---- soft travelling light: fades out at both ends, bright in the middle ---- */
function arcAt(pts,f){f=clamp(f)*(pts.length-1);const i=Math.min(pts.length-2,Math.floor(f)),u=f-i,a=pts[i],b=pts[i+1];return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]}
function comet(v,pts,c,len=.34,{peak=1}={}){
  const N=56,P=[];
  for(let j=0;j<=N;j++){const s=j/N,f=c-len/2+s*len;if(f<0||f>1){P.push(null);continue}const q=arcAt(pts,f),p=project(v,q[0],q[1],q[2]);P.push(p.vis?{x:p.x,y:p.y,s}:null)}
  ctx.save();ctx.lineCap='butt';
  // three passes: wide haze, soft glow, thin bright core
  const passes=[[10,.14,LINE_RGB],[4.5,.32,LINE_RGB],[2.2,1,LINE_RGB]];
  for(const [w0,a0,rgb] of passes){
    for(let j=0;j<N;j++){const a=P[j],b=P[j+1];if(!a||!b)continue;
      const w=Math.sin(Math.PI*(a.s+b.s)/2),k=Math.pow(w,1.4)*peak;if(k<.01)continue;
      ctx.strokeStyle=`rgba(${rgb},${a0*k})`;ctx.lineWidth=Math.max(.4,w0*(.35+.65*w));
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  }
  ctx.restore();
}
/* ---- timeline ----
   0.0–1.8s  meridian draws pole to pole, dots along it brighten
   1.6s      pin lands on London, callout appears
   2.6s+     arcs go out to each client, then pulses loop          */
function frame(t){
  ctx.clearRect(0,0,SW,SH);
  const sway=REDUCED?0:Math.sin(Math.max(0,t-2.4)*.22)*4;
  const R=SH*.922, cx=narrow()?SW*.5:SW*.493, cy=SH*.923;   // proportions from the Figma frame (856 × 458)
  const v=View(STUDIO.coords[0]-6+sway,28,R,cx,cy);
  sphere(v);graticule(v);
  const reveal=eout(clamp(t/1.8));
  dots(v,reveal);
  meridian(v,reveal);

  ARCS.forEach((a,i)=>{
    const st=2.6+i*.22,e=eout(clamp((t-st)/1.3));if(e<=0)return;
    line(v,a.pts,{progress:e,width:1.4,color:`rgba(${LINE_RGB},.45)`});
    if(e<1){comet(v,a.pts,e-.08,.18,{peak:1-Math.pow(e,4)})}
    else if(!REDUCED){const u=((t-st-1.3)/3.2+i*.19)%1;comet(v,a.pts,-.17+u*1.34)}
    const ep=project(v,a.lo,a.la);
    const onScreen=ep.z>0&&ep.y<SH-10&&ep.x>0&&ep.x<SW;
    if(onScreen&&e>=1){ctx.fillStyle=LINE;ctx.fillRect(ep.x-3.9,ep.y-3.9,7.8,7.8)}
    const c=a.el,w=c.offsetWidth; let x=a.side==='left'?ep.x-14-w:ep.x+14; x=clamp(x,6,SW-w-6);
    c.style.transform=`translate(${x}px,${ep.y-16}px)`; c.classList.toggle('show',onScreen&&e>=1);
  });

  const p=project(v,...STUDIO.coords);
  pin.style.transform=`translate(${p.x}px,${p.y}px)`;pin.classList.toggle('show',t>1.6);
}

/* ---- play when in view, pause when not ---- */
let t0=null,visible=false;
new IntersectionObserver(([e])=>{visible=e.isIntersecting;if(visible&&t0===null)t0=performance.now()},{threshold:.3}).observe(el);
(function loop(now){
  if(visible&&t0!==null){if(REDUCED){if(dirty){frame(99);dirty=false}}else frame((now-t0)/1000)}
  requestAnimationFrame(loop);
})(performance.now());

/* ============ Address card ============ */
document.getElementById('directions').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(STUDIO.address);
</script>
